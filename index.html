<!doctype html>
<html lang="ru" data-theme="dark">

    -->
    <header class="header">
      <div class="container header-inner">
        <a class="logo" href="#/"
          ><img src="img/logo.svg" alt="" /><span class="logo-text">Manga<span>G</span></span></a

        <nav class="nav">
          <a href="#/" data-nav="/">Главная</a>
          <a href="#/catalog" data-nav="/catalog">Каталог</a>

          <input class="input" type="search" placeholder="Поиск манги..." aria-label="Поиск" />

        <button class="icon-btn" id="theme-btn" title="Сменить тему">◐</button>

    <main id="app"></main>
